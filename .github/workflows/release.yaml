name: release

# Windows + Android pipeline of the FlClash GH fork. Every push to the fork
# branch builds the Windows installer/zip and the signed Android APKs as
# artifacts; a `v*` tag also publishes them as a GitHub release, which the
# app's built-in update check (constant `repository` in lib/common/constant.dart)
# reads. Android signing needs the KEYSTORE (base64 jks), KEY_ALIAS,
# STORE_PASSWORD and KEY_PASSWORD repository secrets; without them the Gradle
# release config falls back to the debug key and the `.dev` application id.

on:
  push:
    branches:
      - ghosthop
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-amd64
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build installer and portable zip
        run: dart setup.dart windows --env stable -v

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-amd64
          path: ./dist
          overwrite: true

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      # Flutter may have written local.properties without a trailing newline, so
      # the block starts with an empty line: appended keys glued to the last line
      # are invisible to Gradle and the release silently falls back to the debug key.
      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo ""
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties
          test -s android/app/keystore.jks || { echo "keystore.jks is empty: KEYSTORE secret missing"; exit 1; }
          for k in keyAlias storePassword keyPassword; do
            grep -qE "^$k=." android/local.properties || { echo "$k missing in android/local.properties"; exit 1; }
          done
          echo "keystore $(wc -c < android/app/keystore.jks) bytes, signing keys present"

      - name: Build APKs (split per ABI)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable -v

      # A debug-signed APK carries the `.dev` application id and cannot update
      # the fork on users' phones; refuse to publish it.
      - name: Verify APK signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$apk"; echo "$certs" | grep -E "certificate DN|SHA-256 digest"
            echo "$certs" | grep -q "CN=Android Debug" && { echo "::error::$apk is signed with the debug key"; exit 1; }
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: ./dist
          overwrite: true

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      # The JSON block in the notes is what the in-app update dialog renders.
      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dart run tool/changelog.dart render release --tag "$TAG" --out release.md
          version=$(echo "$TAG" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Generate SHA256SUMS
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: ./release.md
          prerelease: ${{ contains(github.ref_name, '-') }}
