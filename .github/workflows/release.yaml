name: release

# Windows-only pipeline of the FlClash GH fork. Every push to the fork branch
# builds the installer and the portable zip as artifacts; a `v*` tag also
# publishes them as a GitHub release, which the app's built-in update check
# (constant `repository` in lib/common/constant.dart) reads.

on:
  push:
    branches:
      - ghosthop
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FLUTTER_VERSION: '3.47.4'
  GO_VERSION: '1.27.1'

jobs:
  build-windows:
    name: Build Windows amd64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-amd64
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build installer and portable zip
        run: dart setup.dart windows --env stable -v

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-amd64
          path: ./dist
          overwrite: true

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      # The JSON block in the notes is what the in-app update dialog renders.
      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dart run tool/changelog.dart render release --tag "$TAG" --out release.md
          version=$(echo "$TAG" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Generate SHA256SUMS
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: ./release.md
          prerelease: ${{ contains(github.ref_name, '-') }}
